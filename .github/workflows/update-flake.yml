name: Update flake.lock and font sources

on:
  schedule:
    # Every day at 03:17 UTC
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Update font versions from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/update-font-versions.sh

      - name: Refresh release asset hashes
        run: .github/scripts/update-font-hashes.sh

      - name: Sync README versions
        run: .github/scripts/update-readme-versions.sh

      - name: Build all fonts
        run: nix build .#default --no-link

      - name: Generate pull request body
        run: .github/scripts/generate-pr-body.sh "$RUNNER_TEMP/pr-body.md"

      - name: Create or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bot/update-flake-lock
          delete-branch: true
          add-paths: |
            flake.lock
            nix
            README.md
          author: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          committer: "Aaron's Bot <155336205+3ayonara@users.noreply.github.com>"
          commit-message: |
            chore: update flake.lock and font sources

            Co-authored-by: Aaron <85681241+27Aaron@users.noreply.github.com>
          title: "chore: update flake.lock and font sources"
          body-path: ${{ runner.temp }}/pr-body.md

      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          merge-method: merge
