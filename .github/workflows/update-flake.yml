name: Update flake.lock and font hashes

on:
  schedule:
    # Every Monday at 03:17 UTC
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-flake
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Update flake.lock
        run: nix flake update

      - name: Refresh release asset hashes
        run: .github/scripts/update-font-hashes.sh

      - name: Build all fonts
        run: nix build .#default --no-link

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: bot/update-flake-lock
          delete-branch: true
          add-paths: |
            flake.lock
            nix
          commit-message: "chore: update flake.lock and font hashes"
          title: "chore: update flake.lock and font hashes"
          body: |
            Automated update generated by [`.github/workflows/update-flake.yml`](../blob/main/.github/workflows/update-flake.yml).

            This PR refreshes:

            - `flake.lock` via `nix flake update`
            - fixed-output hashes for release assets in `nix/*.nix`

            It was validated with `nix build .#default --no-link`.
